  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage * { box-sizing: border-box; }
  /* Text behind the person: elements with the class "behind" render in their own pass, under a
     cut-out of the person (design.ts). The front pass hides them; the behind pass shows only them. */
  #stage[data-pass="front"] .behind { visibility: hidden !important; }
  #stage[data-pass="behind"] * { visibility: hidden !important; }
  #stage[data-pass="behind"] .behind, #stage[data-pass="behind"] .behind * { visibility: visible !important; }
